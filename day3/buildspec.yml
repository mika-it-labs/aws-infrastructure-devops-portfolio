version: 0.2
env:
  shell: bash
phases:
  install:
    runtime-versions:
      java: corretto17
  pre_build:
    commands:
      - set -euo pipefail
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - IMAGE_URI="$REGISTRY/portfolio-day3-tomcat:build-$CODEBUILD_BUILD_NUMBER"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
  build:
    commands:
      - mvn -B -f day3/pom.xml clean verify
      - docker build -t "$IMAGE_URI" day3
      - docker run -d --name portfolio-check -p 127.0.0.1:18080:8080 "$IMAGE_URI"
      - bash day3/smoke-test.sh
    finally:
      - docker logs portfolio-check || true
      - docker rm -f portfolio-check || true
  post_build:
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = 1
      - docker push "$IMAGE_URI"
      - mkdir -p day3/dist/scripts
      - cp day3/target/portfolio.war day3/dist/portfolio.war
      - cp day3/appspec.yml day3/dist/appspec.yml
      - cp day3/deploy/*.sh day3/dist/scripts/
      - printf '[{"name":"tomcat","imageUri":"%s"}]' "$IMAGE_URI" > day3/dist/imagedefinitions.json
      - printf 'commit=%s\nimage=%s\nbuild=%s\n' "$CODEBUILD_RESOLVED_SOURCE_VERSION" "$IMAGE_URI" "$CODEBUILD_BUILD_ID" > day3/dist/build-info.txt
      - cp /tmp/portfolio-container.html day3/dist/container-smoke.html
artifacts:
  base-directory: day3/dist
  files:
    - '**/*'
