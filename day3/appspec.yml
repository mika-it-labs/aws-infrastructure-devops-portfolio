version: 0.0
os: linux
files:
  - source: portfolio.war
    destination: /var/lib/tomcat/webapps
permissions:
  - object: /var/lib/tomcat/webapps/portfolio.war
    owner: tomcat
    group: tomcat
    mode: 640
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root
  BeforeInstall:
    - location: scripts/backup.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/configure.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 120
      runas: root
